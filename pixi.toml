[workspace]
name = "github-issue-tracker"
version = "0.1.0"
description = "Serverless GitHub issue tracker with email alerts and state persistence"
authors = ["DevOps Engineer <devops@example.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11"
requests = ">=2.31.0"

[tasks]
start = "python tracker.py"
dry-run = "python tracker.py --dry-run"
